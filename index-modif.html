<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ma Tournée Dynamique</title>
    <style>
        /* --- Styles existants conservés --- */
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; }
        .app { max-width: 600px; margin: auto; }
        .status-gps { font-size: 0.8em; text-align: center; color: #000; background: #ffcc00; padding: 10px; border-radius: 8px; margin-bottom: 5px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .separateur { background: #333; color: #ffcc00; padding: 10px; text-align: center; font-weight: bold; font-size: 1em; border-radius: 5px; margin: 20px 0 10px 0; border: 1px solid #ffcc00; }
        .ligne-etape { background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 6px solid #ffcc00; position: relative; }
        .etape-haut { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .heure-col { font-size: 1.1em; font-weight: bold; color: #ffcc00; min-width: 65px; }
        .temps-ecart { flex-grow: 1; font-weight: bold; text-align: center; font-size: 0.8em; padding: 5px; border-radius: 4px; }
        .retard { color: #ff4444; background: rgba(255, 68, 68, 0.2); } 
        .avance { color: #00ff00; background: rgba(0, 255, 0, 0.2); }
        .btn-ok { background: #28a745; color: white; padding: 10px 15px; border-radius: 8px; border:none; font-weight:bold; }
        
        /* --- Nouveaux Styles pour l'Edition --- */
        .btn-edit { background: #444; color: #fff; border: none; padding: 8px; border-radius: 5px; font-size: 0.8em; cursor: pointer; }
        .form-ajout { background: #222; border: 2px solid #ffcc00; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input, select { background: #000; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 5px; flex: 1; }
        .btn-add-main { background: #ffcc00; color: #000; width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 15px; cursor: pointer; }
        .btn-delete { background: #600; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; margin-left: 5px; }
    </style>
</head>
<body>

<div class="app">
    <div class="status-gps" id="statusGps">GPS : RECHERCHE...</div>

    <button class="btn-add-main" onclick="toggleForm()">➕ AJOUTER UNE ÉTAPE</button>

    <div id="formEtape" class="form-ajout" style="display: none;">
        <h4 id="formTitle" style="margin-top:0">Nouvelle étape</h4>
        <input type="hidden" id="editIndex">
        <div class="form-row">
            <input type="time" id="newHeure">
            <input type="text" id="newGps" placeholder="Latitude, Longitude">
        </div>
        <div class="form-row">
            <input type="text" id="newLabel" placeholder="Label (ex: MATIN)">
        </div>
        <div class="form-row">
            <button class="btn-valider-heure" onclick="sauvegarderEtape()">ENREGISTRER</button>
            <button class="btn-reset-manuel" style="margin:0" onclick="toggleForm()">ANNULER</button>
        </div>
    </div>

    <div id="listeTournee"></div>
    
    <button class="btn-save" onclick="sauvegarderBilan(true)">💾 SAUVEGARDER LE BILAN DU JOUR</button>
    
    <div class="config-panel">
        <button class="btn-reset-manuel" onclick="forcerReset()">⚠️ RECHARGER LISTE PAR DÉFAUT (RESET)</button>
    </div>
    <div class="historique">
        <h3 style="margin-top:0; color:#007bff;">Derniers Bilans</h3>
        <div id="zoneHistorique"></div>
    </div>
</div>

<script>
    // Liste initiale (Master)
    const LISTE_MASTER = [
        { h: "07:25", gps: "50.7826858, 4.3399798" },
        { h: "15:50", gps: "50.7910066, 4.4172985", label: "APRÈS-MIDI" }
    ];

    let etapes = JSON.parse(localStorage.getItem('maTournee')) || chargerMaster();
    let maPositionActuelle = null;

    function chargerMaster() {
        const data = LISTE_MASTER.map(item => ({
            hPrevue: item.h, gps: item.gps, label: item.label || null, fait: false, ecartFinal: null, dist: null
        }));
        save();
        return data;
    }

    function save() {
        localStorage.setItem('maTournee', JSON.stringify(etapes));
    }

    // --- NOUVELLES FONCTIONS D'EDITION ---

    function toggleForm(index = -1) {
        const form = document.getElementById('formEtape');
        const isVisible = form.style.display === 'block';
        
        if (!isVisible || index !== -1) {
            form.style.display = 'block';
            if (index >= 0) {
                // Mode Modification
                document.getElementById('formTitle').innerText = "Modifier l'étape";
                document.getElementById('editIndex').value = index;
                document.getElementById('newHeure').value = etapes[index].hPrevue;
                document.getElementById('newGps').value = etapes[index].gps;
                document.getElementById('newLabel').value = etapes[index].label || "";
            } else {
                // Mode Ajout
                document.getElementById('formTitle').innerText = "Nouvelle étape";
                document.getElementById('editIndex').value = -1;
                document.getElementById('newHeure').value = "";
                document.getElementById('newGps').value = "";
                document.getElementById('newLabel').value = "";
            }
        } else {
            form.style.display = 'none';
        }
    }

    function sauvegarderEtape() {
        const h = document.getElementById('newHeure').value;
        const g = document.getElementById('newGps').value;
        const l = document.getElementById('newLabel').value;
        const idx = document.getElementById('editIndex').value;

        if (!h || !g) return alert("Heure et GPS obligatoires");

        const nouvelleDonnee = { hPrevue: h, gps: g, label: l || null, fait: false, ecartFinal: null, dist: null };

        if (idx >= 0) {
            etapes[idx] = { ...etapes[idx], ...nouvelleDonnee };
        } else {
            etapes.push(nouvelleDonnee);
            // Optionnel : Trier par heure après ajout
            etapes.sort((a, b) => a.hPrevue.localeCompare(b.hPrevue));
        }

        save();
        toggleForm();
        afficher();
    }

    function supprimerEtape(index) {
        if(confirm("Supprimer cette étape ?")) {
            etapes.splice(index, 1);
            save();
            afficher();
        }
    }

    // --- LOGIQUE EXISTANTE MISE À JOUR ---

    function afficher() {
        const liste = document.getElementById('listeTournee');
        liste.innerHTML = "";
        
        etapes.forEach((etape, i) => {
            if(etape.label) {
                const sep = document.createElement('div');
                sep.className = "separateur";
                sep.innerText = "☀️ " + etape.label;
                liste.appendChild(sep);
            }
            
            const res = etape.fait && etape.ecartFinal ? etape.ecartFinal : calculerEcart(etape.hPrevue);
            
            const div = document.createElement('div');
            div.className = `ligne-etape ${etape.fait ? 'fait' : ''}`;
            div.innerHTML = `
                <div class="etape-haut">
                    <button class="btn-edit" onclick="toggleForm(${i})">✏️</button>
                    <span class="heure-col">${etape.hPrevue}</span>
                    <span class="temps-ecart ${res.classe}">${res.texte}</span>
                    <button class="btn-ok" onclick="valider(${i})">${etape.fait ? '✓' : 'OK'}</button>
                    <button class="btn-delete" onclick="supprimerEtape(${i})">×</button>
                </div>
            `;
            liste.appendChild(div);
        });
        // (Reste du code historique inchangé...)
    }

    // [Garder ici tes fonctions existantes : demarrerGps, calculerDistance, calculerToutesLesDistances, calculerEcart, valider, etc.]
    
    function forcerReset() {
        if(confirm("Cela effacera tes modifs perso pour remettre la liste d'origine. OK ?")) {
            etapes = chargerMaster(); 
            afficher();
        }
    }

    // Ré-intégration des fonctions manquantes pour le fonctionnement
    function valider(i) {
        if (!etapes[i].fait) { etapes[i].ecartFinal = calculerEcart(etapes[i].hPrevue); etapes[i].fait = true; }
        else { etapes[i].fait = false; etapes[i].ecartFinal = null; }
        save();
        afficher();
    }

    function calculerEcart(hPrevue) {
        const maintenant = new Date();
        const [h, m] = hPrevue.split(':').map(Number);
        const cible = new Date(); cible.setHours(h, m, 0, 0);
        const diff = maintenant - cible;
        const sec = Math.floor(Math.abs(diff) / 1000);
        return { texte: `${diff > 0 ? "+" : "-"}${Math.floor(sec / 60)}m ${sec % 60}s`, classe: diff > 0 ? "retard" : "avance" };
    }

    // Lancer l'app
    afficher();
</script>
</body>
</html>
