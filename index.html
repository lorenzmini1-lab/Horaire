<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ma Tournée Dynamique</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; }
        .app { max-width: 600px; margin: auto; }
        .status-gps { font-size: 0.8em; text-align: center; color: #000; background: #ffcc00; padding: 10px; border-radius: 8px; margin-bottom: 5px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .separateur { background: #333; color: #ffcc00; padding: 10px; text-align: center; font-weight: bold; font-size: 1em; border-radius: 5px; margin: 20px 0 10px 0; border: 1px solid #ffcc00; }
        .ligne-etape { background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 6px solid #ffcc00; display: flex; flex-direction: column; }
        .etape-haut { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .heure-col { font-size: 1.1em; font-weight: bold; color: #ffcc00; min-width: 65px; }
        .temps-ecart { flex-grow: 1; font-weight: bold; text-align: center; font-size: 0.8em; padding: 5px; border-radius: 4px; }
        .retard { color: #ff4444; background: rgba(255, 68, 68, 0.2); } 
        .avance { color: #00ff00; background: rgba(0, 255, 0, 0.2); }
        .btn-ok { background: #28a745; color: white; padding: 10px 15px; border-radius: 8px; border:none; font-weight:bold; }
        .dist-live { font-size: 0.8em; margin-top: 8px; color: #00d4ff; font-style: italic; }
        .proche { color: #ffcc00; font-weight: bold; font-style: normal; }
        .fait { opacity: 0.3; border-left-color: #28a745; background: #0a200a; }
        .btn-edit { background: #444; color: #fff; border: none; padding: 8px; border-radius: 5px; font-size: 0.8em; cursor: pointer; }
        .btn-delete { background: #441111; color: #ff4444; border: none; padding: 8px; border-radius: 5px; font-weight: bold; }
        .form-ajout { background: #222; border: 2px solid #ffcc00; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input { background: #000; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 5px; flex: 1; }
        .btn-add-main { background: #ffcc00; color: #000; width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 15px; cursor: pointer; }
        .btn-save { background: #007bff; color: white; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .config-panel { background: #222; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px dashed #444; }
        .historique { background: #111; border: 1px solid #333; padding: 10px; border-radius: 10px; margin-top: 20px; font-size: 0.75em; }
        .bilan-item { border-bottom: 1px solid #222; padding: 8px 0; color: #aaa; }
    </style>
</head>
<body>

<div class="app">
    <div class="status-gps" id="statusGps">GPS : RECHERCHE...</div>

    <button class="btn-add-main" onclick="toggleForm()">➕ AJOUTER UNE ÉTAPE</button>

    <div id="formEtape" class="form-ajout" style="display: none;">
        <h4 id="formTitle" style="margin-top:0">Nouvelle étape</h4>
        <input type="hidden" id="editIndex">
        <div class="form-row">
            <input type="time" id="newHeure">
            <input type="text" id="newGps" placeholder="Latitude, Longitude">
        </div>
        <div class="form-row">
            <input type="text" id="newLabel" placeholder="Label (Optionnel)">
        </div>
        <div class="form-row">
            <button class="btn-save" style="margin:0; background:#28a745" onclick="sauvegarderEtape()">ENREGISTRER</button>
            <button class="btn-save" style="margin:0; background:#666" onclick="toggleForm()">ANNULER</button>
        </div>
    </div>

    <div id="listeTournee"></div>
    
    <button class="btn-save" onclick="sauvegarderBilan(true)">💾 SAUVEGARDER LE BILAN DU JOUR</button>

    <div class="config-panel">
        <button class="btn-save" style="background:#b30000; font-size:0.8em; margin:0;" onclick="forcerReset()">⚠️ RÉINITIALISER LA LISTE COMPLÈTE</button>
    </div>

    <div class="historique">
        <h3 style="margin-top:0; color:#007bff;">Derniers Bilans</h3>
        <div id="zoneHistorique"></div>
    </div>
</div>

<script>
    const LISTE_MASTER = [
        { h: "07:25", gps: "50.7826858, 4.3399798" },
        { h: "07:30", gps: "50.7885291, 4.3414057" },
        { h: "07:33", gps: "50.7942730, 4.3412415" },
        { h: "07:37", gps: "50.7787243, 4.3540467" },
        { h: "07:41", gps: "50.7828007, 4.3578604" },
        { h: "07:42", gps: "50.7823892, 4.3604944" },
        { h: "07:44", gps: "50.7810071, 4.3666949" },
        { h: "07:45", gps: "50.7833575, 4.3739386" },
        { h: "07:46", gps: "50.7869441, 4.3703220" },
        { h: "07:49", gps: "50.7886495, 4.3727225" },
        { h: "07:52", gps: "50.7928772, 4.3726273" },
        { h: "07:55", gps: "50.7936972, 4.3673065" },
        { h: "07:56", gps: "50.7947988, 4.3728841" },
        { h: "07:56", gps: "50.7954049, 4.3736211" },
        { h: "07:57", gps: "50.7978734, 4.3757447" },
        { h: "08:25", gps: "50.7910066, 4.4172985" },
        { h: "15:50", gps: "50.7910066, 4.4172985", label: "APRÈS-MIDI" },
        { h: "16:02", gps: "50.7986269, 4.3755851" },
        { h: "16:03", gps: "50.7980270, 4.3755382" },
        { h: "16:04", gps: "50.7953786, 4.3735383" },
        { h: "16:05", gps: "50.7947963, 4.3728158" },
        { h: "16:06", gps: "50.7936925, 4.3672435" },
        { h: "16:08", gps: "50.7928804, 4.3725583" },
        { h: "16:14", gps: "50.7887235, 4.3721915" },
        { h: "16:17", gps: "50.7873776, 4.3714844" },
        { h: "16:20", gps: "50.7833563, 4.3738662" },
        { h: "16:23", gps: "50.7810276, 4.3666071" },
        { h: "16:26", gps: "50.7823657, 4.3605855" },
        { h: "16:27", gps: "50.7827827, 4.3578188" },
        { h: "16:30", gps: "50.7786227, 4.3545197" },
        { h: "16:34", gps: "50.7826023, 4.3401699" },
        { h: "16:40", gps: "50.7885234, 4.3414383" },
        { h: "16:48", gps: "50.7938468, 4.3399805" }
    ];

    let etapes = [];
    let maPositionActuelle = null;

    // Chargement initial sécurisé
    function initialiserDonnees() {
        const saved = localStorage.getItem('maTournee');
        if (saved && saved !== "[]") {
            try {
                etapes = JSON.parse(saved);
            } catch (e) {
                etapes = chargerMaster();
            }
        } else {
            etapes = chargerMaster();
        }
    }

    function chargerMaster() {
        const data = LISTE_MASTER.map(item => ({
            hPrevue: item.h, gps: item.gps, label: item.label || null, fait: false, ecartFinal: null, dist: null
        }));
        localStorage.setItem('maTournee', JSON.stringify(data));
        return data;
    }

    function save() { localStorage.setItem('maTournee', JSON.stringify(etapes)); }

    function toggleForm(index = -1) {
        const form = document.getElementById('formEtape');
        form.style.display = (form.style.display === 'none' || index >= 0) ? 'block' : 'none';
        if (index >= 0) {
            document.getElementById('formTitle').innerText = "Modifier l'étape";
            document.getElementById('editIndex').value = index;
            document.getElementById('newHeure').value = etapes[index].hPrevue;
            document.getElementById('newGps').value = etapes[index].gps;
            document.getElementById('newLabel').value = etapes[index].label || "";
        } else {
            document.getElementById('formTitle').innerText = "Nouvelle étape";
            document.getElementById('editIndex').value = -1;
            document.getElementById('newHeure').value = "";
            document.getElementById('newGps').value = "";
            document.getElementById('newLabel').value = "";
        }
    }

    function sauvegarderEtape() {
        const h = document.getElementById('newHeure').value;
        const g = document.getElementById('newGps').value;
        const l = document.getElementById('newLabel').value;
        const idx = document.getElementById('editIndex').value;
        if (!h || !g) return alert("Heure et GPS requis");

        const obj = { hPrevue: h, gps: g, label: l || null, fait: false, ecartFinal: null, dist: null };
        if (idx >= 0) { etapes[idx] = { ...etapes[idx], ...obj }; }
        else { etapes.push(obj); etapes.sort((a,b) => a.hPrevue.localeCompare(b.hPrevue)); }
        save(); toggleForm(); afficher();
    }

    function supprimerEtape(index) {
        if(confirm("Supprimer cette étape ?")) { etapes.splice(index, 1); save(); afficher(); }
    }

    function demarrerGps() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                maPositionActuelle = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                document.getElementById('statusGps').innerText = `📡 GPS ACTIF (+/- ${Math.round(pos.coords.accuracy)}m)`;
                calculerToutesLesDistances();
            }, null, { enableHighAccuracy: true });
        }
    }

    function calculerDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function calculerToutesLesDistances() {
        if (!maPositionActuelle) return;
        etapes.forEach((etape, i) => {
            const coords = etape.gps.split(',').map(c => parseFloat(c.trim()));
            const d = calculerDistance(maPositionActuelle.lat, maPositionActuelle.lon, coords[0], coords[1]);
            etapes[i].dist = d;
            if (!etape.fait && d < 60) { valider(i); if(navigator.vibrate) navigator.vibrate(400); }
        });
        afficher();
    }

    function calculerEcart(hPrevue) {
        const maintenant = new Date();
        const [h, m] = hPrevue.split(':').map(Number);
        const cible = new Date(); cible.setHours(h, m, 0, 0);
        const diff = maintenant - cible;
        const sec = Math.floor(Math.abs(diff) / 1000);
        return { texte: `${diff > 0 ? "+" : "-"}${Math.floor(sec / 60)}m ${sec % 60}s`, classe: diff > 0 ? "retard" : "avance" };
    }

    function valider(i) {
        if (!etapes[i].fait) { etapes[i].ecartFinal = calculerEcart(etapes[i].hPrevue); etapes[i].fait = true; }
        else { etapes[i].fait = false; etapes[i].ecartFinal = null; }
        save(); afficher();
    }

    function afficher() {
        const liste = document.getElementById('listeTournee');
        if (!liste) return;
        liste.innerHTML = "";
        
        etapes.forEach((etape, i) => {
            if(etape.label) {
                const sep = document.createElement('div');
                sep.className = "separateur";
                sep.innerText = "☀️ " + etape.label;
                liste.appendChild(sep);
            }
            const res = etape.fait && etape.ecartFinal ? etape.ecartFinal : calculerEcart(etape.hPrevue);
            const distTxt = (etape.dist !== null && !etape.fait) ? `<div class="dist-live ${etape.dist < 100 ? 'proche' : ''}">📍 Distance : ${etape.dist}m</div>` : "";
            
            const div = document.createElement('div');
            div.className = `ligne-etape ${etape.fait ? 'fait' : ''}`;
            div.innerHTML = `
                <div class="etape-haut">
                    <button class="btn-edit" onclick="toggleForm(${i})">✏️</button>
                    <span class="heure-col">${etape.hPrevue}</span>
                    <span class="temps-ecart ${res.classe}">${res.texte}</span>
                    <button class="btn-ok" onclick="valider(${i})">${etape.fait ? '✓' : 'OK'}</button>
                    <button class="btn-delete" onclick="supprimerEtape(${i})">×</button>
                </div>
                ${distTxt}`;
            liste.appendChild(div);
        });
        
        const hist = JSON.parse(localStorage.getItem('historiqueBilans')) || [];
        document.getElementById('zoneHistorique').innerHTML = hist.length ? hist.map(b => `<div class="bilan-item">${b}</div>`).join('') : "Aucun bilan.";
    }

    function sauvegarderBilan(manuel) {
        let pts = etapes.filter(e => e.fait).length;
        if (pts === 0) return;
        let texte = `${new Date().toLocaleDateString()}: `;
        etapes.forEach(e => { if(e.fait) texte += `[${e.hPrevue}: ${e.ecartFinal.texte}] `; });
        let h = JSON.parse(localStorage.getItem('historiqueBilans')) || [];
        h.unshift(texte);
        localStorage.setItem('historiqueBilans', JSON.stringify(h.slice(0, 10)));
        if(manuel) alert("Bilan enregistré !");
        afficher();
    }

    function forcerReset() {
        if(confirm("Réinitialiser avec la liste par défaut ?")) { 
            etapes = chargerMaster(); 
            afficher(); 
        }
    }

    // Lancement de l'app
    initialiserDonnees();
    demarrerGps();
    afficher(); // Affichage immédiat
    setInterval(afficher, 5000); // Rafraîchissement auto
</script>
</body>
</html>
