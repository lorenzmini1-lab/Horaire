<!DOCTYPE html>
<html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ma Tournée Dynamique v4.0</title>
    <style>
        :root {
            --accent: #ffcc00;
            --safe: #28a745;
            --danger: #ff4444;
            --info: #00d4ff;
        }

        body.dark-mode {
            --bg: #000;
            --card-bg: #111;
            --text: #fff;
            --border: #222;
            --modal-overlay: rgba(0,0,0,0.9);
        }

        body.light-mode {
            --bg: #f4f4f4;
            --card-bg: #ffffff;
            --text: #000;
            --border: #ddd;
            --modal-overlay: rgba(255,255,255,0.95);
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; transition: background 0.3s; overflow-x: hidden; }
        .app { max-width: 600px; margin: auto; }
        
        #modalStart {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
        .logo-start { font-size: 4em; margin-bottom: 20px; }
        .btn-start { 
            background: var(--accent); color: #000; border: none; 
            padding: 20px 40px; border-radius: 50px; font-size: 1.2em; 
            font-weight: 900; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }

        .header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
        .status-gps { flex-grow: 1; font-size: 0.85em; text-align: center; color: #000; background: var(--accent); padding: 12px; border-radius: 12px; font-weight: 800; }
        
        .horloge-principale { font-size: 1.2em; font-weight: 900; color: var(--accent); background: var(--card-bg); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); font-variant-numeric: tabular-nums; text-align: center; }
        
        .btn-theme { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 12px; font-size: 1.2em; width: 45px; height: 45px; cursor: pointer; }

        .separateur { background: var(--card-bg); color: var(--accent); padding: 12px; text-align: center; font-weight: bold; border-radius: 8px; margin: 20px 0 10px 0; border: 1px solid var(--accent); }
        
        .ligne-etape { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--accent); display: flex; flex-direction: column; border: 1px solid var(--border); }
        .etape-haut { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        
        .heure-col { font-size: 1.1em; font-weight: 900; color: var(--accent); min-width: 60px; }
        .temps-ecart { flex-grow: 1; font-weight: bold; text-align: center; font-size: 0.85em; padding: 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
        .retard { color: var(--danger); background: rgba(255, 68, 68, 0.1); border: 1px solid var(--danger); } 
        .avance { color: var(--safe); background: rgba(0, 255, 0, 0.1); border: 1px solid var(--safe); }
        
        .btn-ok { background: var(--safe); color: white; padding: 10px 15px; border-radius: 8px; border:none; font-weight:bold; cursor: pointer; }
        .btn-edit { background: #333; color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
        .btn-delete { background: #441111; color: var(--danger); border: 1px solid var(--danger); padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .dist-live { font-size: 0.85em; margin-top: 10px; color: var(--info); font-weight: 600; }
        .fait-visuel { opacity: 0.3; transform: scale(0.98); border-left-color: var(--safe); }
        
        #customConfirm, #modalFin, #modalEdit { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-overlay); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 2px solid var(--accent); width: 85%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .input-modal { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1em; box-sizing: border-box; }

        .btn-save { background: #007bff; color: white; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        #codeOutput { width: 100%; height: 150px; background: #000; color: #00ff00; font-size: 10px; margin-top: 10px; }

        .historique-zone { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-top: 20px; }
        .hist-item { font-size: 0.85em; padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
        .hist-header { display: flex; justify-content: space-between; font-weight: bold; }
    </style>
</head>
<body class="light-mode">

<div id="modalStart" style="display: none;">
    <div class="logo-start">🚛</div>
    <h1 style="color: var(--accent); margin-bottom: 10px;">BONJOUR !</h1>
    <p style="margin-bottom: 30px; font-size: 0.9em; opacity: 0.8;">Es-tu prêt à commencer ta tournée ?</p>
    <button class="btn-start" onclick="demarrerJournee()">DÉMARRER MA JOURNÉE</button>
</div>

<div id="customConfirm" style="display: none;">
    <div class="modal-content" style="border-color: var(--danger);">
        <h3 style="margin-top:0; color: var(--danger);">⚠️ Supprimer ?</h3>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button onclick="validerSuppression()" style="background:var(--danger); color:white; flex:1; padding:15px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">OUI</button>
            <button onclick="document.getElementById('customConfirm').style.display='none'" style="background:#444; color:white; flex:1; padding:15px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">NON</button>
        </div>
    </div>
</div>

<div id="modalFin">
    <div class="modal-content">
        <h2 style="margin-top:0; color: var(--safe);">🏁 Tournée terminée !</h2>
        <p id="timerText">Fermeture dans 10s...</p>
        <button class="btn-start" style="padding:10px 20px; font-size:0.9em" onclick="annulerFermeture()">RESTER ICI</button>
    </div>
</div>

<div id="modalEdit" style="display: none;">
    <div class="modal-content">
        <h3 id="titreModalEdit" style="margin-top:0; color: var(--accent); margin-bottom: 20px;">✏️ Modifier l'étape</h3>
        <input type="hidden" id="editIndex" value="">
        <input type="time" id="newHeure" class="input-modal">
        <input type="text" id="newGps" placeholder="Coordonnées (ex: 50.84, 4.43) ou Adresse" class="input-modal">
        <select id="newLabel" class="input-modal">
            <option value="MATIN">MATIN</option>
            <option value="APRÈS-MIDI">APRÈS-MIDI</option>
        </select>
        <div style="display:flex; gap:10px;">
            <button class="btn-save" style="background:var(--safe); flex:1;" onclick="sauvegarderEtape()">ENREGISTRER</button>
            <button class="btn-save" style="background:#444; flex:1;" onclick="fermerModalEdit()">ANNULER</button>
        </div>
    </div>
</div>

<div class="app">
    <div class="header-controls">
        <div class="status-gps" id="statusGps">📡 Recherche GPS...</div>
        <div id="horlogeActuelle" class="horloge-principale">00:00:00</div>
        <button class="btn-theme" onclick="toggleTheme()">🌓</button>
    </div>
    
    <button class="btn-save" style="background:var(--accent); color:#000; margin-bottom:15px;" onclick="ouvrirModalEdit(-1)">➕ AJOUTER ÉTAPE</button>

    <div id="listeTournee"></div>
    
    <div class="historique-zone">
        <h4 style="margin-top:0; color:var(--info)">📜 RÉCAPITULATIF DES PASSAGES</h4>
        <div id="logs" style="max-height: 200px; overflow-y: auto;"></div>
    </div>

    <div style="margin-top:30px; padding: 15px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);">
        <button class="btn-save" onclick="genererNouveauCode()">⚙️ GÉNÉRER CODE GITHUB</button>
        <div id="zoneExport" style="display:none">
            <textarea id="codeOutput" readonly=""></textarea>
            <button class="btn-save" style="background:var(--safe); margin-top:10px;" onclick="copierCode()">📋 COPIER LE CODE</button>
        </div>
        <button onclick="forcerReset()" style="background:none; color:#666; border:none; width:100%; margin-top:15px; font-size:0.8em; text-decoration:underline; cursor:pointer;">Réinitialiser Master</button>
    </div>
</div>

<script>
    const LISTE_MASTER = [
        { "h": "07:35", "gps": "Avenue Emile Vandervelde 47, 1200 Woluwe-Saint-Lambert", "label": "MATIN" },
        { "h": "07:40", "gps": "50.841995, 4.451544", "label": "MATIN" },
        { "h": "07:47", "gps": "Rue Konkel 149, 1200 Woluwe Saint Lambert", "label": "MATIN" },
        { "h": "07:48", "gps": "Rue Konkel 220, 1200 Bruxelles", "label": "MATIN" },
        { "h": "07:50", "gps": "Olieslagerslaan 32, 1150 Woluwe Saint Pierre", "label": "MATIN" },
        { "h": "07:52", "gps": "Av. Edmond Parmentier 246, 1150 Woluwe-Saint-Pierre", "label": "MATIN" },
        { "h": "07:55", "gps": "Av. Edmond Parmentier 135, 1150 Woluwe-Saint-Pierre", "label": "MATIN" },
        { "h": "07:57", "gps": "Av. Edmond Parmentier 2, 1150 Woluwe-Saint-Pierre", "label": "MATIN" },
        { "h": "08:25", "gps": "50.791801, 4.419546", "label": "MATIN" },
        { "h": "15:50", "gps": "50.791801, 4.419546", "label": "APRÈS-MIDI" },
        { "h": "16:11", "gps": "Av. Edmond Parmentier 2, 1150 Woluwe-Saint-Pierre", "label": "APRÈS-MIDI" },
        { "h": "16:12", "gps": "Av. Edmond Parmentier 135, 1150 Woluwe-Saint-Pierre", "label": "APRÈS-MIDI" },
        { "h": "16:13", "gps": "Av. Edmond Parmentier 246, 1150 Woluwe-Saint-Pierre", "label": "APRÈS-MIDI" },
        { "h": "16:17", "gps": "Rue Konkel 149, 1200 Woluwe Saint Lambert", "label": "APRÈS-MIDI" },
        { "h": "16:18", "gps": "Rue Konkel 220, 1200 Bruxelles", "label": "APRÈS-MIDI" },
        { "h": "16:19", "gps": "Olieslagerslaan 32, 1150 Woluwe Saint Pierre", "label": "APRÈS-MIDI" },
        { "h": "16:22", "gps": "50.841995, 4.451544", "label": "APRÈS-MIDI" },
        { "h": "16:26", "gps": "Avenue Emile Vandervelde 47, 1200 Woluwe-Saint-Lambert", "label": "APRÈS-MIDI" }
    ];

    let etapes = [];
    let maPositionActuelle = null;
    let indexASupprimer = null;
    let timerFinActive = false;
    let compteARebours = 10;
    let intervalId = null;
    const coordsCache = {}; 

    // RÉINITIALISATION AUTOMATIQUE LE LENDEMAIN
    function verifierChangementDeJour() {
        const aujourdhui = new Date().toDateString();
        const derniereDate = localStorage.getItem('derniereDateUtilisation');

        if (derniereDate && derniereDate !== aujourdhui) {
            etapes.forEach(e => {
                e.fait = false;
                e.cachee = false;
                delete e.ecartFinal;
            });
            save();
            localStorage.removeItem('tourneeDemarree');
        }
        localStorage.setItem('derniereDateUtilisation', aujourdhui);
    }

    function verifierEtValiderHoraire() {
        const maintenant = new Date();
        const heureActuelle = maintenant.getHours();

        if (heureActuelle >= 9) {
            let modif = false;
            etapes.forEach(e => {
                if (e.label === "MATIN" && !e.fait) {
                    e.fait = true;
                    e.cachee = true;
                    e.ecartFinal = { texte: "Passé", classe: "avance" };
                    modif = true;
                }
            });
            if (modif) {
                save();
            }
            localStorage.setItem('tourneeDemarree', 'true');
        }
    }

    function mettreAJourHorloge() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('horlogeActuelle').innerText = `${h}:${m}:${s}`;
    }

    function demarrerJournee() {
        document.getElementById('modalStart').style.display = 'none';
        localStorage.setItem('tourneeDemarree', 'true');
        demarrerGps();
    }

    function initTheme() {
        const saved = localStorage.getItem('themePref');
        if (saved) document.body.className = saved;
        else document.body.className = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark-mode" : "light-mode";
    }

    function toggleTheme() {
        document.body.className = document.body.classList.contains('dark-mode') ? 'light-mode' : 'dark-mode';
        localStorage.setItem('themePref', document.body.className);
    }

    function ajouterLogPassage(etape, auto) {
        const logBox = document.getElementById('logs');
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        const res = etape.ecartFinal;
        const item = document.createElement('div');
        item.className = 'hist-item';
        item.innerHTML = `<div class="hist-header"><span class="hist-heure">📍 ${etape.hPrevue}</span><span class="hist-badge ${res.classe}">${res.texte}</span></div>
                          <div style="font-size:0.8em;color:#aaa">Passé à ${timeStr} (${auto ? '🤖 Auto' : '🖐️ Manuel'})</div>`;
        logBox.prepend(item);
        const hist = JSON.parse(localStorage.getItem('logsTournee') || "[]");
        hist.unshift({ hP: etape.hPrevue, hR: timeStr, ecart: res.texte, cl: res.classe, methode: auto });
        localStorage.setItem('logsTournee', JSON.stringify(hist.slice(0, 50)));
    }

    function chargerLogsSauvegardes() {
        const hist = JSON.parse(localStorage.getItem('logsTournee') || "[]");
        const logBox = document.getElementById('logs');
        logBox.innerHTML = "";
        hist.forEach(h => {
            const item = document.createElement('div');
            item.className = 'hist-item';
            item.innerHTML = `<div class="hist-header"><span class="hist-heure">📍 ${h.hP}</span><span class="hist-badge ${h.cl}">${h.ecart}</span></div>
                              <div style="font-size:0.8em;color:#aaa">Passé à ${h.hR} (${h.methode ? '🤖 Auto' : '🖐️ Manuel'})</div>`;
            logBox.appendChild(item);
        });
    }

    function chargerMaster() {
        const data = LISTE_MASTER.map(item => ({ hPrevue: item.h, gps: item.gps, label: item.label, fait: false, cachee: false, dist: null }));
        localStorage.setItem('maTournee_v2', JSON.stringify(data));
        return data;
    }

    function save() { localStorage.setItem('maTournee_v2', JSON.stringify(etapes)); }

    function ouvrirModalEdit(idx = -1) {
        document.getElementById('modalEdit').style.display = 'flex';
        const titre = document.getElementById('titreModalEdit');
        if (idx >= 0) {
            titre.innerText = "✏️ Modifier l'étape";
            document.getElementById('editIndex').value = idx;
            document.getElementById('newHeure').value = etapes[idx].hPrevue;
            document.getElementById('newGps').value = etapes[idx].gps;
            document.getElementById('newLabel').value = etapes[idx].label;
        } else {
            titre.innerText = "➕ Ajouter une étape";
            document.getElementById('editIndex').value = "";
            document.getElementById('newHeure').value = "";
            document.getElementById('newGps').value = "";
            document.getElementById('newLabel').value = "MATIN";
        }
    }

    function fermerModalEdit() {
        document.getElementById('modalEdit').style.display = 'none';
    }

    function sauvegarderEtape() {
        const h = document.getElementById('newHeure').value;
        const g = document.getElementById('newGps').value;
        const l = document.getElementById('newLabel').value;
        const idx = document.getElementById('editIndex').value;
        
        if (!h || !g) return;
        
        if (idx !== "") {
            etapes[idx] = { ...etapes[idx], hPrevue: h, gps: g, label: l, dist: null };
        } else { 
            etapes.push({ hPrevue: h, gps: g, label: l, fait: false, cachee: false, dist: null }); 
            etapes.sort((a,b) => a.hPrevue.localeCompare(b.hPrevue)); 
        }
        
        save(); 
        fermerModalEdit(); 
        afficher();
        calculerToutesLesDistances();
    }

    function demanderSuppression(idx) { 
        indexASupprimer = idx; 
        document.getElementById('customConfirm').style.display = 'flex'; 
    }

    function validerSuppression() { 
        if(indexASupprimer !== null) { 
            etapes.splice(indexASupprimer, 1); 
            indexASupprimer = null;
            save(); 
            afficher(); 
        } 
        document.getElementById('customConfirm').style.display = 'none'; 
    }

    function demarrerGps() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                maPositionActuelle = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                document.getElementById('statusGps').innerText = `📡 GPS OK`;
                calculerToutesLesDistances();
            }, (err) => {
                document.getElementById('statusGps').innerText = `⚠️ GPS Inaccessible`;
            }, { enableHighAccuracy: true });
        }
    }

    function calculerDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    async function obtenirCoordonnees(chaineGps) {
        if (!chaineGps) return null;
        const nettoyee = chaineGps.replaceAll('|', ',').trim();
        
        if (coordsCache[nettoyee]) return coordsCache[nettoyee];

        const parts = nettoyee.split(',').map(p => parseFloat(p.trim()));
        if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
            coordsCache[nettoyee] = { lat: parts[0], lon: parts[1] };
            return coordsCache[nettoyee];
        }

        try {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(nettoyee)}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data && data.length > 0) {
                const coords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
                coordsCache[nettoyee] = coords;
                return coords;
            }
        } catch (e) {
            console.error("Erreur de géocodage pour:", chaineGps, e);
        }
        return null;
    }

    async function calculerToutesLesDistances() {
        if (!maPositionActuelle) return;
        const hAct = new Date().getHours();
        
        for (let i = 0; i < etapes.length; i++) {
            const etape = etapes[i];
            if (etape.fait) continue;
            const bonCr = (etape.label === "MATIN") ? (hAct < 13) : (hAct >= 13);
            if (!bonCr) { etapes[i].dist = null; continue; }

            const coords = await obtenirCoordonnees(etape.gps);
            if (coords) {
                const d = calculerDistance(maPositionActuelle.lat, maPositionActuelle.lon, coords.lat, coords.lon);
                etapes[i].dist = d;
                if (d < 10) validerEtMasquer(i, true);
            }
        }
        afficher();
        verifierFin(hAct);
    }

    function validerEtMasquer(i, auto = false) {
        if (!etapes[i].fait) {
            etapes[i].ecartFinal = calculerEcart(etapes[i].hPrevue);
            etapes[i].fait = true;
            ajouterLogPassage(etapes[i], auto);
            save();
            setTimeout(() => { etapes[i].cachee = true; afficher(); }, 4000);
            afficher();
        }
    }

    function verifierFin(hAct) {
        const cr = hAct < 13 ? "MATIN" : "APRÈS-MIDI";
        const etDuCr = etapes.filter(e => e.label === cr);
        if (etDuCr.length > 0 && etDuCr.every(e => e.fait) && !timerFinActive) {
            timerFinActive = true;
            setTimeout(() => { document.getElementById('modalFin').style.display = 'flex'; demarrerTimerFin(); }, 2000);
        }
    }

    // RÉINITIALISATION APRÈS LES 10 SECONDES
    function demarrerTimerFin() {
        compteARebours = 10;
        document.getElementById('timerText').innerText = `Fermeture dans ${compteARebours}s...`;
        intervalId = setInterval(() => {
            compteARebours--;
            document.getElementById('timerText').innerText = `Fermeture dans ${compteARebours}s...`;
            if(compteARebours <= 0) { 
                clearInterval(intervalId); 
                
                // Réinitialisation de l'état local
                localStorage.removeItem('tourneeDemarree');
                etapes.forEach(e => { e.fait = false; e.cachee = false; delete e.ecartFinal; });
                save();

                // Masquage de la modale de fin
                document.getElementById('modalFin').style.display = 'none';
                timerFinActive = false;

                // Réaffichage de la liste réinitialisée et de l'écran d'accueil
                afficher();
                document.getElementById('modalStart').style.display = 'flex';
            }
        }, 1000);
    }

    function annulerFermeture() { 
        document.getElementById('modalFin').style.display = 'none'; 
        if(intervalId) clearInterval(intervalId); 
        timerFinActive = false;
    }

    function calculerEcart(hPrevue) {
        const maintenant = new Date(), [h, m] = hPrevue.split(':').map(Number), cible = new Date();
        cible.setHours(h, m, 0, 0);
        const diff = maintenant - cible;
        const absSec = Math.floor(Math.abs(diff) / 1000);
        const hrs = Math.floor(absSec / 3600), min = Math.floor((absSec % 3600) / 60), sec = absSec % 60;
        let txt = diff > 0 ? "+" : "-";
        if (hrs > 0) txt += `${hrs}h ${min}m ${sec}s`;
        else txt += `${min}m ${sec}s`;
        return { texte: txt, classe: diff > 0 ? "retard" : "avance" };
    }

    function afficher() {
        const liste = document.getElementById('listeTournee');
        liste.innerHTML = "";
        let dernierLabel = "";
        etapes.forEach((etape, idx) => {
            if (etape.cachee) return;
            if(etape.label !== dernierLabel) {
                const sep = document.createElement('div'); sep.className = "separateur";
                sep.innerText = (etape.label === "MATIN" ? "☀️ " : "🌙 ") + etape.label;
                liste.appendChild(sep); dernierLabel = etape.label;
            }
            const res = etape.ecartFinal || calculerEcart(etape.hPrevue);
            div = document.createElement('div');
            div.className = `ligne-etape ${etape.fait ? 'fait-visuel' : ''}`;
            div.innerHTML = `<div class="etape-haut">
                <span class="heure-col">${etape.hPrevue}</span>
                <span class="temps-ecart ${res.classe}">${res.texte}</span>
                <button class="btn-ok" onclick="validerEtMasquer(${idx})">${etape.fait ? '✓' : 'OK'}</button>
                <button class="btn-edit" onclick="ouvrirModalEdit(${idx})">✏️</button>
                <button class="btn-delete" onclick="demanderSuppression(${idx})">&times;</button>
            </div>
            ${etape.dist !== null ? `<div class="dist-live">📍 À ${etape.dist}m</div>` : ""}`;
            liste.appendChild(div);
        });
    }

    function genererNouveauCode() {
        const clean = etapes.map(e => ({ h: e.hPrevue, gps: e.gps, label: e.label }));
        let htmlSource = `<!DOCTYPE html>\n<html lang="fr">` + document.documentElement.innerHTML + `</html>`;
        htmlSource = htmlSource.replace(/const LISTE_MASTER = \[[\s\S]*?\];/, `const LISTE_MASTER = ${JSON.stringify(clean, null, 8)};`);
        
        document.getElementById('codeOutput').value = htmlSource;
        document.getElementById('zoneExport').style.display = 'block';
    }

    async function copierCode() { 
        const txt = document.getElementById('codeOutput').value;
        if (navigator.clipboard) {
            await navigator.clipboard.writeText(txt);
            alert("Code copié dans le presse-papier !");
        } else {
            document.getElementById('codeOutput').select();
            document.execCommand("copy");
            alert("Copié !");
        }
    }

    function forcerReset() { 
        if(confirm("Réinitialiser à la liste par défaut ?")) { 
            localStorage.removeItem('logsTournee'); 
            localStorage.removeItem('tourneeDemarree'); 
            etapes = chargerMaster(); 
            location.reload(); 
        } 
    }

    document.addEventListener('DOMContentLoaded', () => {
        initTheme();
        
        const saved = localStorage.getItem('maTournee_v2');
        etapes = (saved && saved !== "[]") ? JSON.parse(saved) : chargerMaster();

        verifierChangementDeJour();
        verifierEtValiderHoraire();

        mettreAJourHorloge();
        setInterval(mettreAJourHorloge, 1000);
        
        if (localStorage.getItem('tourneeDemarree') === 'true') {
            document.getElementById('modalStart').style.display = 'none';
            demarrerGps();
        } else {
            document.getElementById('modalStart').style.display = 'flex';
        }

        chargerLogsSauvegardes();
        afficher();
        setInterval(afficher, 1000);
    });
</script>

</body></html>
