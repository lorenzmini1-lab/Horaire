<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ma Tournée Dynamique</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; }
        .app { max-width: 600px; margin: auto; }
        .status-gps { font-size: 0.8em; text-align: center; color: #000; background: #ffcc00; padding: 10px; border-radius: 8px; margin-bottom: 5px; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .separateur { background: #333; color: #ffcc00; padding: 10px; text-align: center; font-weight: bold; font-size: 1em; border-radius: 5px; margin: 20px 0 10px 0; border: 1px solid #ffcc00; }
        .ligne-etape { background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 6px solid #ffcc00; display: flex; flex-direction: column; }
        .etape-haut { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .heure-col { font-size: 1.1em; font-weight: bold; color: #ffcc00; min-width: 65px; }
        .temps-ecart { flex-grow: 1; font-weight: bold; text-align: center; font-size: 0.8em; padding: 5px; border-radius: 4px; }
        .retard { color: #ff4444; background: rgba(255, 68, 68, 0.2); } 
        .avance { color: #00ff00; background: rgba(0, 255, 0, 0.2); }
        .btn-ok { background: #28a745; color: white; padding: 10px 15px; border-radius: 8px; border:none; font-weight:bold; }
        .dist-live { font-size: 0.8em; margin-top: 8px; color: #00d4ff; font-style: italic; }
        .proche { color: #ffcc00; font-weight: bold; font-style: normal; }
        .fait { opacity: 0.3; border-left-color: #28a745; background: #0a200a; }
        
        /* Styles Edition */
        .btn-edit { background: #444; color: #fff; border: none; padding: 8px; border-radius: 5px; font-size: 0.8em; cursor: pointer; }
        .btn-delete { background: #441111; color: #ff4444; border: none; padding: 8px; border-radius: 5px; font-weight: bold; }
        .form-ajout { background: #222; border: 2px solid #ffcc00; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input { background: #000; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 5px; flex: 1; }
        .btn-add-main { background: #ffcc00; color: #000; width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 15px; cursor: pointer; }
        
        /* Config & Historique */
        .btn-save { background: #007bff; color: white; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .config-panel { background: #222; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px dashed #444; }
        .historique { background: #111; border: 1px solid #333; padding: 10px; border-radius: 10px; margin-top: 20px; font-size: 0.75em; }
        .bilan-item { border-bottom: 1px solid #222; padding: 8px 0; color: #aaa; }
    </style>
</head>
<body>

<div class="app">
    <div class="status-gps" id="statusGps">GPS : RECHERCHE...</div>

    <button class="btn-add-main" onclick="toggleForm()">➕ AJOUTER UNE ÉTAPE</button>

    <div id="formEtape" class="form-ajout" style="display: none;">
        <h4 id="formTitle" style="margin-top:0">Nouvelle étape</h4>
        <input type="hidden" id="editIndex">
        <div class="form-row">
            <input type="time" id="newHeure">
            <input type="text" id="newGps" placeholder="Latitude, Longitude">
        </div>
        <div class="form-row">
            <input type="text" id="newLabel" placeholder="Label (Optionnel)">
        </div>
        <div class="form-row">
            <button class="btn-save" style="margin:0; background:#28a745" onclick="sauvegarderEtape()">ENREGISTRER</button>
            <button class="btn-save" style="margin:0; background:#666" onclick="toggleForm()">ANNULER</button>
        </div>
    </div>

    <div id="listeTournee"></div>
    
    <button class="btn-save" onclick="sauvegarderBilan(true)">💾 SAUVEGARDER LE BILAN DU JOUR</button>

    <div class="config-panel">
        <input type="time" id="inputResetTime" style="width:100px">
        <button onclick="confirmerNouvelleHeure()" style="padding:10px">VALIDER HEURE RESET</button>
        <button class="btn-save" style="background:#b30000; font-size:0.8em;" onclick="forcerReset()">⚠️ RESET LISTE (MASTER)</button>
    </div>

    <div class="historique">
        <h3 style="margin-top:0; color:#007bff;">Derniers Bilans</h3>
        <div id="zoneHistorique"></div>
    </div>
</div>

    ];

    let etapes = JSON.parse(localStorage.getItem('maTournee')) || chargerMaster();
    let maPositionActuelle = null;

    function chargerMaster() {
        const data = LISTE_MASTER.map(item => ({
            hPrevue: item.h, gps: item.gps, label: item.label || null, fait: false, ecartFinal: null, dist: null
        }));
        localStorage.setItem('maTournee', JSON.stringify(data));
        return data;
    }

    function save() { localStorage.setItem('maTournee', JSON.stringify(etapes)); }

    // --- LOGIQUE ÉDITION ---
    function toggleForm(index = -1) {
        const form = document.getElementById('formEtape');
        form.style.display = (form.style.display === 'none' || index >= 0) ? 'block' : 'none';
        if (index >= 0) {
            document.getElementById('formTitle').innerText = "Modifier l'étape";
            document.getElementById('editIndex').value = index;
            document.getElementById('newHeure').value = etapes[index].hPrevue;
            document.getElementById('newGps').value = etapes[index].gps;
            document.getElementById('newLabel').value = etapes[index].label || "";
        } else {
            document.getElementById('formTitle').innerText = "Nouvelle étape";
            document.getElementById('editIndex').value = -1;
            document.getElementById('newHeure').value = "";
            document.getElementById('newGps').value = "";
            document.getElementById('newLabel').value = "";
        }
    }

    function sauvegarderEtape() {
        const h = document.getElementById('newHeure').value;
        const g = document.getElementById('newGps').value;
        const l = document.getElementById('newLabel').value;
        const idx = document.getElementById('editIndex').value;
        if (!h || !g) return alert("Heure et GPS requis");

        const obj = { hPrevue: h, gps: g, label: l || null, fait: false, ecartFinal: null, dist: null };
        if (idx >= 0) { etapes[idx] = { ...etapes[idx], ...obj }; }
        else { etapes.push(obj); etapes.sort((a,b) => a.hPrevue.localeCompare(b.hPrevue)); }
        save(); toggleForm(); afficher();
    }

    function supprimerEtape(index) {
